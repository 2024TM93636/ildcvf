spring:
  application:
    name: ildcvf-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:ildcvf}
    username: ${POSTGRES_USER:ildcvf}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

ildcvf:
  environment: ${ILDCVF_ENVIRONMENT:development}
  contract:
    baseline-path: ${OPENAPI_BASELINE_PATH:../datasets/openapi/baseline/resident-api-v1.yaml}

  targets:
    resident:
      service-id: resident-api
      base-url: ${RESIDENT_API_BASE_URL:http://localhost:8090}

  traffic:
    repository: postgres
    max-capture-bytes: ${TRAFFIC_MAX_CAPTURE_BYTES:65536}

    request-header-allowlist:
      - Accept
      - Content-Type
      - User-Agent
      - X-Correlation-ID
      - If-Match
      - If-None-Match

    response-header-allowlist:
      - Content-Type
      - Location
      - ETag
      - Cache-Control
      - Allow
      - X-Correlation-ID